<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verified — cozyer</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: #f6f3ee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fdfcfa;
      border-radius: 20px;
      border: 0.5px solid #ebe5d8;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .logo {
      display: block;
      height: 32px;
      width: auto;
      margin: 0 auto 1.75rem;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #ebe5d8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .title {
      font-size: 22px;
      font-weight: 600;
      color: #1e1a14;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    .subtitle {
      font-size: 15px;
      color: #6b5f4a;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: block;
      width: 100%;
      background: #8a6a3a;
      color: #f6f3ee;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-family: 'Quicksand', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .footer {
      font-size: 13px;
      color: #a89b85;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://cozyerdesign.com/cozyer-logo.png" alt="cozyer" />
    <div class="icon">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="15" cy="15" r="13" stroke="#8a6a3a" stroke-width="2"/>
        <path d="M9 15.5l4 4 8-8" stroke="#8a6a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="title">You're confirmed.</p>
    <p class="subtitle">Your email has been verified. Open the app to start reimagining your space.</p>
    <a class="btn" href="com.cozyerdesgain.cozyer://" 
       onclick="setTimeout(function(){ window.location.href='https://apps.apple.com/app/id6776891175'; }, 1500);">
      Open cozyer
    </a>
    <p class="footer">Already in the app? Just log in to get started.</p>
  </div>
</body>
</html>
