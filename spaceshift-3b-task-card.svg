<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 152" width="480" height="152">
  <title>SpaceShift — Stage 3B — Task card</title>
  <defs>
    <filter id="tcShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"></feGaussianBlur>
      <feOffset dx="0" dy="4"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    
    <linearGradient id="thumbWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE3CF"></stop><stop offset="1" stop-color="#E0CFB1"></stop>
    </linearGradient>
    <linearGradient id="thumbFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B58E60"></stop><stop offset="1" stop-color="#8E6A42"></stop>
    </linearGradient>
    <clipPath id="thumbClip"><rect x="20" y="20" width="112" height="112" rx="14"></rect></clipPath>
  </defs>

  
  <rect x="10" y="10" width="460" height="132" rx="20" fill="#FDFBF7" filter="url(#tcShadow)"></rect>

  
  <g clip-path="url(#thumbClip)">
    <rect x="20" y="20" width="112" height="112" fill="url(#thumbWall)"></rect>
    
    <polygon points="20,132 132,132 132,96 50,96" fill="url(#thumbFloor)"></polygon>
    
    <rect x="34" y="62" width="54" height="38" rx="6" fill="#B5926A"></rect>
    <rect x="30" y="76" width="62" height="22" rx="6" fill="#FBF1DC"></rect>
    <rect x="40" y="60" width="22" height="18" rx="6" fill="#D97757"></rect>
    
    <path d="M52 80 Q 64 74 78 80 L 78 92 Q 64 96 52 92 Z" fill="#1A1F2E"></path>
    
    <rect x="96" y="104" width="22" height="18" fill="#C99863"></rect>
    <path d="M96 104 L 118 104" stroke="#7E5C32" stroke-width="1" opacity="0.6"></path>
    
    <ellipse cx="40" cy="118" rx="14" ry="4" fill="#1A1F2E" opacity="0.8"></ellipse>
  </g>

  
  
  <g transform="translate(152,32)">
    <rect x="0" y="0" width="118" height="28" rx="14" fill="#EFE9DF"></rect>
    <circle cx="14" cy="14" r="4" fill="#8BA989"></circle>
    <text x="26" y="19" font-family="&#39;General Sans&#39;, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3D4451">Declutter</text>
  </g>

  
  <g transform="translate(286,32)" font-family="&#39;JetBrains Mono&#39;, ui-monospace, monospace" font-size="12" fill="#7A7F8A">
    
    <g stroke="#7A7F8A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="14" r="8"></circle>
      <path d="M10 9 L 10 14 L 14 16"></path>
    </g>
    <text x="26" y="18" font-weight="500" letter-spacing="0.04em">15 min</text>
  </g>

  
  <text x="152" y="90" font-family="&#39;General Sans&#39;, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#1A1F2B" letter-spacing="-0.015em">Clear floor clothes pile</text>
  <text x="152" y="116" font-family="&#39;General Sans&#39;, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#7A7F8A" letter-spacing="-0.005em">Sort into laundry, donate, or put away</text>

  
  <g transform="translate(412,52)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#D97757"></rect>
    <path d="M 9 19 L 16 26 L 28 12" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>
</svg>